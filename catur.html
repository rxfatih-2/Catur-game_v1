<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Royale</title>
<style>
:root{--bg:#e9eef3;--fg:#14202b;--cd:#f8fafc;--ac:#0f8f80;--bd:#c3d0dc;--lt:#dbe4ec;--dk:#6d8ba6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--fg:#e6eef5;--cd:#17212b;--ac:#35c4b0;--bd:#2a3a49;--lt:#b9c7d4;--dk:#4a6580}}
:root[data-theme="dark"]{--bg:#0d141b;--fg:#e6eef5;--cd:#17212b;--ac:#35c4b0;--bd:#2a3a49;--lt:#b9c7d4;--dk:#4a6580}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden;opacity:0;visibility:hidden;transform:scale(1.06);transition:opacity .5s,transform .5s,visibility 0s .5s;background:radial-gradient(circle at 50% 30%,var(--cd),var(--bg) 72%)}
.scr.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
/* intro */
.bgp span{position:absolute;bottom:-70px;opacity:.12;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.kn{font-size:96px;line-height:1;color:var(--ac);filter:drop-shadow(0 0 18px var(--ac));animation:gal 1.3s cubic-bezier(.2,1.2,.4,1) backwards,glow 2.5s 1.3s ease-in-out infinite}
@keyframes gal{from{transform:translateX(-130vw) rotate(-25deg)}}
@keyframes glow{50%{transform:scale(1.08);filter:drop-shadow(0 0 30px var(--ac))}}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.i.f{fill:currentColor;stroke:none}
.kn .i,.bgp .i{width:1em;height:1em}
#snd,#cfg{display:grid;place-items:center;padding:0}
h1{margin:0;font:700 clamp(32px,10vw,50px)/1 "Palatino Linotype",Palatino,"Book Antiqua",serif;letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:center}
h1 i{font-style:normal;display:inline-block;animation:ltr .6s backwards}
@keyframes ltr{from{opacity:0;transform:translateY(30px) rotate(12deg)}}
.sp{width:min(80vw,320px);height:40px;border-radius:8px;background:repeating-conic-gradient(var(--dk) 0 25%,var(--lt) 0 50%) 0 0/40px 40px;animation:sw 1s .4s backwards,scr 4s linear infinite}
@keyframes sw{from{transform:scaleX(0)}}
@keyframes scr{to{background-position:80px 0}}
.ld{width:min(60vw,240px);height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.ld i{display:block;height:100%;background:var(--ac);animation:ld 2.4s .3s ease-in-out both}
@keyframes ld{from{width:0}to{width:100%}}
.go{padding:12px 36px;border-radius:30px;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .15s}
.go:active{transform:scale(.95)}
#enter{animation:pop .5s 2.7s backwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
/* menu */
.mt{margin:0;font:700 28px "Palatino Linotype",Palatino,serif}
.card{width:min(88vw,360px);padding:16px 18px;border-radius:16px;border:2px solid var(--bd);background:var(--cd);text-align:left;display:block;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:19px}
.card small{opacity:.7}
.on .card{animation:pop .45s backwards}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(88vw,360px)}
.g2 .card{width:auto;text-align:center}
.lnk{background:none;border:0;opacity:.7;padding:8px}
/* game */
#game{--s:min(100vw,56vh,560px);--s:min(100vw,60dvh,560px);gap:8px;padding:8px 0}
#hd{display:flex;align-items:center;gap:8px;width:min(94vw,520px)}
#hd button{padding:6px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--cd)}
#st{flex:1;text-align:center;font-weight:700}
#md{opacity:.7;font-size:14px;text-align:center}
#cv{width:var(--s);height:var(--s);touch-action:none;cursor:grab}
#cv canvas{display:block}
#ov,#pz,#pr{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .4s}
#ov.on,#pz.on,#pr.on{opacity:1;visibility:visible}
#ov>div,#pz>div,#pr>div{background:var(--cd);border:2px solid var(--ac);border-radius:20px;padding:24px;text-align:center;width:min(86vw,320px)}
#ov.on>div,#pz.on>div,#pr.on>div{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
#ov h2,#pz h2,#pr h2{margin:8px 0 16px}
#oe{display:block;font-size:64px;color:var(--ac);animation:bn 1s infinite alternate}
@keyframes bn{to{transform:translateY(-12px) rotate(8deg)}}
#snd,#cfg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);font-size:20px}
#cfg{right:64px}
#set,#wt,#iv{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s}
#set.on,#wt.on,#iv.on{opacity:1;visibility:visible}
#set>div,#wt>div,#iv>div{background:var(--cd);border:2px solid var(--ac);border-radius:20px;padding:20px;width:min(88vw,340px);display:flex;flex-direction:column;gap:10px}
#set.on>div,#wt.on>div,#iv.on>div{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
#set h2,#wt h2,#iv h2{margin:0 0 4px;font:700 22px "Palatino Linotype",Palatino,serif}
.tr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:none;text-align:left;width:100%}
.tr.on{border-color:var(--ac);background:rgba(53,196,176,.14)}
.vl{display:flex;align-items:center;gap:10px}
.vl input{flex:1;accent-color:var(--ac)}
.bgp span{pointer-events:none}
.scr>*:not(.bgp){position:relative;z-index:1}
.mt{background:linear-gradient(90deg,var(--fg),var(--ac),var(--fg));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:shn 3.5s infinite}
@keyframes shn{60%,100%{left:140%}}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}
.ic{display:inline-block;font-style:normal;color:var(--ac)}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.15)}}
.g2 .card{border-color:var(--c)}
.g2 .card:nth-child(1){--c:#4caf50}.g2 .card:nth-child(2){--c:#2f9bff}.g2 .card:nth-child(3){--c:#ff8a3d}.g2 .card:nth-child(4){--c:#d946ef}
.g2 .card:hover{box-shadow:0 0 20px -2px var(--c)}
#hd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#st::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--dot,#f4f1ea);box-shadow:0 0 0 2px var(--bd),0 0 10px var(--dot,#fff);animation:pls 1.2s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.35)}}
.bump{animation:pop .35s}
#ct{display:flex;gap:8px;width:min(94vw,520px)}
#ct button{flex:1;padding:10px 6px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);font-weight:600;transition:transform .12s,opacity .2s}
#ct button:active{transform:scale(.93)}
#ct button:disabled{opacity:.35}
#cv.shake{animation:shk .6s}
@keyframes shk{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
#ov,#pz,#pr{overflow:hidden}
#ov>div,#pz>div,#pr>div{position:relative}
#ov.win::before{content:"";position:absolute;width:250vmax;height:250vmax;left:50%;top:50%;margin:-125vmax 0 0 -125vmax;background:repeating-conic-gradient(rgba(242,201,76,.2) 0 10deg,transparent 0 20deg);animation:spn 14s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
@keyframes glw{50%{filter:drop-shadow(0 0 18px #f2c94c)}}
#ov.win>div{border-color:#f2c94c;box-shadow:0 0 50px rgba(242,201,76,.6)}
#ov.win #oe{animation:bn .6s infinite alternate,glw 1.5s infinite}
#ov.lose{background:rgba(70,0,10,.7)}
#ov.lose.on>div{border-color:#e04545;animation:shk .6s,pop .5s}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pg button{display:flex;flex-direction:column;align-items:center;padding:10px 2px;border-radius:14px;border:2px solid var(--bd);background:var(--cd);font-size:13px;animation:pop .4s backwards;transition:transform .12s}
.pg button:nth-child(2){animation-delay:.07s}.pg button:nth-child(3){animation-delay:.14s}.pg button:nth-child(4){animation-delay:.21s}
.pg button:active{transform:scale(.9)}
.pg b{font-size:36px;line-height:1.1;color:var(--ac)}
.big{display:block;font-size:56px;color:var(--ac)}
.inp{padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--cd);color:var(--fg);font:inherit}
#ol .inp{width:min(88vw,360px)}
.row{display:flex;gap:8px;width:min(88vw,360px)}
.row .inp{flex:1;width:auto;min-width:0}
#cd{text-transform:uppercase;letter-spacing:.2em;text-align:center}
#olm{min-height:1.4em;font-size:14px;text-align:center;max-width:min(88vw,360px)}
#cf{width:min(88vw,360px);font-size:14px}
#cf summary{cursor:pointer;opacity:.7}
#cf textarea{margin:8px 0;width:100%!important}
#rc{font:700 40px/1.2 monospace;letter-spacing:.2em;color:var(--ac);margin:6px 0}
#wt .go{margin-top:8px}
#iv{z-index:50}
#iv>div,#wt>div{text-align:center;align-items:center}
#pls{display:flex;flex-direction:column;gap:6px;width:min(88vw,360px);max-height:28vh;overflow:auto}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px solid var(--bd);background:var(--cd);animation:pop .3s}
.pl span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .go{padding:6px 14px;font-size:14px;box-shadow:none}
.pl .go:disabled{opacity:.4;background:var(--bd);color:var(--fg)}
.dt{width:10px;height:10px;border-radius:50%;background:#888;flex:none}
.dt.on{background:#35c46a;box-shadow:0 0 8px #35c46a;animation:pls 1.4s ease-in-out infinite}
.plh{width:min(88vw,360px);display:flex;justify-content:space-between;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--cd);color:var(--fg);border:2px solid var(--ac);border-radius:14px;padding:10px 16px;z-index:60;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.bgp,.p{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></symbol><symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol><symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14zM5 19l7-7"/></symbol><symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l11 11M15 4l5 0 0 5M20 4L9 15M4 20l3-3M20 20l-3-3M4 4h5M4 4v5"/></symbol><symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/></symbol><symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol><symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol><symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol><symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol><symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4c0 3 1 4 4 5M16 6h4c0 3-1 4-4 5M12 14v4M8 21h8M10 18h4"/></symbol><symbol id="i-sad" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 16c1-1.5 2.2-2 3.5-2s2.5.5 3.5 2"/></symbol><symbol id="i-draw" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 10h8M8 14h8"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol><symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol><symbol id="p-p" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.3"/><path d="M9.3 11h5.4l1.3 6H8zM6 21l1.2-3h9.6l1.2 3z"/></symbol><symbol id="p-r" viewBox="0 0 24 24"><path d="M6 4h2.5v2h2V4h3v2h2V4H18v5l-2 2v6l2 2.5V21H6v-1.5L8 17v-6L6 9z"/></symbol><symbol id="p-b" viewBox="0 0 24 24"><path d="M12 2.5c1.6 0 3.2 2.1 3.2 4.6 0 1.7-1 3-2.2 3.9V12h2v2h-2v3.5l2.5 1.5V21h-7v-2l2.5-1.5V14h-2v-2h2v-1c-1.2-.9-2.2-2.2-2.2-3.9 0-2.5 1.6-4.6 3.2-4.6z"/></symbol><symbol id="p-n" viewBox="0 0 24 24"><path d="M7 21v-2.2c0-3 1.6-4.6 3.4-6.2L9 11.5l-1.4 1.1L5.5 11c1.5-2.4 3.6-4.6 5.8-5.7L12.3 3l1.4 1.8C17.5 5.8 19 9 19 13v8z"/></symbol><symbol id="p-q" viewBox="0 0 24 24"><path d="M4 8l3.5 5L9 6l3 6 3-6 1.5 7L20 8l-1.6 11H5.6zM6 20.5h12V22H6z"/></symbol><symbol id="p-k" viewBox="0 0 24 24"><path d="M11 2h2v2h2v2h-2v2.2c3 .6 5.5 3.3 5.5 6.3V19h-11v-4.5c0-3 2.5-5.7 5.5-6.3V6H9V4h2zM6 20.5h12V22H6z"/></symbol></svg>
<div id="intro" class="scr on">
  <div class="bgp"></div>
  <div class="kn"><svg class="i f" aria-hidden="true"><use href="#p-n"/></svg></div>
  <h1></h1>
  <div class="sp"></div>
  <div class="ld"><i></i></div>
  <button class="go" id="enter" disabled>Masuk</button>
</div>

<div id="menu" class="scr">
  <div class="bgp"></div>
  <div class="sp" style="height:18px"></div>
  <h2 class="mt">Pilih mode main</h2>
  <div id="mm" class="col">
    <button class="card" data-m="pvp"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-users"/></svg></i> Main Berdua</b><small>Dua pemain bergantian di satu layar</small></button>
    <button class="card" data-m="bot"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-bot"/></svg></i> Lawan Bot</b><small>Kamu main Putih, bot main Hitam</small></button>
    <button class="card" data-m="online"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-globe"/></svg></i> Main Online</b><small>1 lawan 1 beda HP, tercatat di Firebase</small></button>
  </div>
  <div id="lv" class="col" hidden>
    <small>Pilih level bot</small>
    <div class="g2">
      <button class="card" data-l="1"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-leaf"/></svg></i> Easy</b><small>Santai</small></button>
      <button class="card" data-l="2"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-swords"/></svg></i> Medium</b><small>Mulai pintar</small></button>
      <button class="card" data-l="3"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-flame"/></svg></i> Hard</b><small>Menantang</small></button>
      <button class="card" data-l="4"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-crown"/></svg></i> Professional</b><small>Berpikir dalam</small></button>
    </div>
    <button class="lnk" id="lb">Kembali</button>
  </div>
  <div id="ol" class="col" hidden>
    <small>Main online 1 lawan 1, beda HP atau device</small>
    <input class="inp" id="nm" placeholder="Namamu" maxlength="14" autocomplete="off">
    <button class="card" id="mk"><b><i class="ic"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></i> Buat Room</b><small>Dapat kode untuk dikirim ke temanmu</small></button>
    <div class="row"><input class="inp" id="cd" placeholder="KODE" maxlength="5" autocomplete="off"><button class="go" id="jn">Gabung</button></div>
    <div class="plh"><b>Pemain online (<span id="plc">0</span>)</b><small>langsung tantang</small></div>
    <div id="pls"><small>Memuat daftar pemain…</small></div>
    <div id="olm"></div>
    <button class="lnk" id="ob">Kembali</button>
  </div>
</div>

<div id="game" class="scr">
  <div class="bgp"></div>
  <div id="hd"><button id="back">Menu</button><div id="st"></div><button id="rs" aria-label="Ulangi"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
  <div id="cv"></div>
  <div id="ct"><button id="un" disabled><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg> Undo</button><button id="re" disabled><svg class="i" aria-hidden="true"><use href="#i-redo"/></svg> Redo</button><button id="ps"><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg> Jeda</button></div>
  <div id="md"></div>

async function startOnline(c,col,ended){me=col;code=c;RM=DB.ref('rooms/'+c);mc=0;MV={};rec=ended?1:0;LS=[];PL={};oppOn=1;
 $('#wt').classList.remove('on');IVT=null;clearTimeout(ivto);start('online',0);presOn();
 const on=(ref,ev,fn)=>{LS.push(ref);ref.on(ev,fn)};let first=1;
 on(RM.child('moves'),'value',s=>{const v=s.val()||{},ks=Object.keys(v).map(Number).sort((x,y)=>x-y);
  if(first){first=0;if(ks.length){replay(ks.map(k=>v[k]));return}}
  ks.forEach(k=>{if(k>=mc)MV[k]=v[k]});drain()});
 on(RM.child('players'),'value',s=>{PL=s.val()||{};md()});
 on(RM.child('presence/'+(me==='w'?'b':'w')),'value',s=>{oppOn=!!s.val();md()});
 on(RM.child('meta/result'),'value',s=>{const r=s.val();if(!r||done||r.reason!=='resign')return;recordEnd(r.winner,'resign',0);const win=r.winner===me;
  fin(win?1:2,win?'Lawan menyerah. Kamu menang!':'Kamu menyerah',win?'trophy':'sad',r.winner==='w'?'b':'w','Selesai')});
 const pr=RM.child('presence/'+me);pr.set(true);pr.onDisconnect().remove();md();
 const cf=x=>{if(x.val()&&RM){pr.set(true);pr.onDisconnect().remove()}};
 DB.ref('.info/connected').on('value',cf);LS.push({off:()=>DB.ref('.info/connected').off('value',cf)})}
let MV={},dto;
function drain(){if(mode!=='online'||!RM)return;
 if(Date.now()<rdy){clearTimeout(dto);dto=setTimeout(drain,rdy-Date.now()+60);return}
 while(MV[mc]&&!done){const x=MV[mc];delete MV[mc];const m=LM.find(y=>y.f===x.f&&y.t===x.t);
  if(!m){MV={};RM.child('moves').once('value').then(s=>replay(Object.values(s.val()||{})));return}
  play(x.pr?{...m,pr:x.pr}:m,1)}}
function replay(arr){S={b:init(),t:'w',c:{K:1,Q:1,k:1,q:1},ep:-1};H=[];R=[];last=null;mc=0;sel=null;done=0;
 arr.forEach(x=>{LM=legal(S);const m=LM.find(y=>y.f===x.f&&y.t===x.t);if(!m)return;const mv=x.pr?{...m,pr:x.pr}:m;H.push({S,last});S=mk(S,mv);last=mv;mc++});
 LM=legal(S);build(.7);paint();const ck=inChk(S.b,S.t);status(ck);if(!LM.length){rec=1;end(ck)}}
function resign(){if(!RM||done)return;RM.child('meta').update({status:'ended',result:{winner:me==='w'?'b':'w',reason:'resign',by:me,ts:ST}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden||!FBOK||mode!=='online'||!RM)return;
 try{DB.goOnline()}catch(e){}
 RM.child('moves').once('value').then(x=>{const v=x.val()||{};Object.keys(v).forEach(k=>{if(+k>=mc)MV[+k]=v[k]});drain()}).catch(()=>{})});
$('#mk').onclick=mkRoom;$('#jn').onclick=()=>joinRoom();
$('#pls').onclick=e=>{const b=e.target.closest('button[data-u]');if(b&&!b.disabled)invite(b.dataset.u,b.dataset.n)};
$('#nm').onchange=()=>{if(pOn)presOn()};
$('#ivy').onclick=()=>{$('#iv').classList.remove('on');const v=IV;IV=null;if(!v)return;DB.ref('invites/'+UID).remove();joinRoom(v.room)};
$('#ivx').onclick=()=>{$('#iv').classList.remove('on');const v=IV;IV=null;if(!v)return;DB.ref('rooms/'+v.room+'/meta/declined').set(true).catch(()=>{});DB.ref('invites/'+UID).remove()};
$('#cd').oninput=e=>e.target.value=e.target.value.toUpperCase();
$('#ob').onclick=()=>{presOff();$('#mm').hidden=false;$('#ol').hidden=true};
$('#wc').onclick=cancelWait;
$('#sh').onclick=()=>{const u=location.origin+location.pathname+'?room='+code;
 if(navigator.share)navigator.share({title:'Chess Royale',text:'Main catur online! Kode room: '+code,url:u}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>$('#sh').textContent='Link disalin')};
try{init3d();addEventListener('resize',fit);fit();requestAnimationFrame(loop)}catch(e){R3=null;cv.textContent='Perangkat ini belum mendukung grafik 3D (WebGL).'}

/* ===== intro ===== */
const FP=['k','q','r','b','n','p'];
const BGH=[...Array(16)].map((_,i)=>`<span style="left:${i*37%100}%;font-size:${24+i*5%30}px;animation-duration:${9+i%5*2}s;animation-delay:-${i*1.3}s">${ic(FP[i%6],1)}</span>`).join('');
document.querySelectorAll('.bgp').forEach(b=>b.innerHTML=BGH);
$('h1').innerHTML=[...'Chess Royale'].map((c,i)=>`<i style="animation-delay:${1+i*.07}s">${c===' '?'&nbsp;':c}</i>`).join('');
setTimeout(()=>$('#enter').disabled=false,2700);
</script>
<script>
/* Chess Royale Plus: timer, Ranked acak, papan peringkat, chat + emoji */
(()=>{
const st=document.createElement('style');
st.textContent=`
#game{--s:min(100vw,48dvh,520px)}
#clk{display:flex;gap:8px;width:min(94vw,520px)}
#clk div{flex:1;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--cd);font-weight:600;transition:.2s}
#clk b{font:700 18px/1 ui-monospace,monospace}
#clk .on{border-color:var(--ac);box-shadow:0 0 14px -2px var(--ac)}
#clk .lo b{color:#e04545;animation:pls .6s infinite}
#tcs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(88vw,360px)}
#tcs button{padding:6px 12px;border-radius:20px;border:2px solid var(--bd);background:var(--cd);font-size:13px}
#tcs .on{border-color:var(--ac);background:var(--ac);color:#fff}
#qe{display:flex;gap:6px;width:min(94vw,520px);align-items:center}
#qe button{padding:6px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);font-size:18px}
#qe .inp{flex:1;min-width:0;padding:7px 10px;font-size:14px}
#bub{position:absolute;left:10px;top:calc(70px + env(safe-area-inset-top,0px));z-index:26;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:70vw}
.bb{background:var(--cd);border:2px solid var(--bd);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:14px;animation:pop .3s}
.bb.me{border-color:var(--ac)}
#game .fe{position:absolute;z-index:27;font-size:64px;pointer-events:none;animation:fe 1.8s ease-out forwards}
@keyframes fe{0%{transform:scale(.2) rotate(-20deg);opacity:0}20%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:translateY(-120px) scale(1) rotate(-10deg);opacity:0}}
#lbm{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s}
#lbm.on{opacity:1;visibility:visible}
#lbm>div{background:var(--cd);border:2px solid var(--ac);border-radius:20px;padding:20px;width:min(90vw,360px);display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
#lbl{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;width:100%}
#lbl .pl b{width:28px;text-align:center}`;
document.head.appendChild(st);

/* ---- UI ---- */
$('#hd').insertAdjacentHTML('afterend','<div id="clk" hidden><div id="ckb">Hitam <b></b></div><div id="ckw">Putih <b></b></div></div>');
$('#ct').insertAdjacentHTML('afterend','<div id="qe">'+['😂','😏','🔥','😎','😭','👏'].map(e=>`<button data-e="${e}">${e}</button>`).join('')+'<input class="inp" id="ci" maxlength="60" placeholder="Ketik pesan" autocomplete="off"><button id="cs">➤</button></div><div id="bub"></div>');
$('.mt').insertAdjacentHTML('afterend','<div id="tcs"></div>');
$('#mk').insertAdjacentHTML('beforebegin','<button class="card" id="rk"><b><svg class="i" aria-hidden="true"><use href="#i-crown"/></svg> Ranked Acak</b><small>Dicarikan lawan otomatis, dapat poin</small></button>');
$('[data-m="online"]').insertAdjacentHTML('afterend','<button class="card" id="lbk"><b><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg> Papan Peringkat</b><small>Siapa paling sering menang</small></button>');
document.body.insertAdjacentHTML('beforeend','<div id="lbm"><div><h2 style="margin:0">Papan Peringkat</h2><small>Poin dari main Ranked</small><div id="lbl"></div><button class="go" id="lbx">Tutup</button></div></div>');

/* ---- Timer ---- */
let TC=0,TCS=0,CK={w:0,b:0},lt=0,RK=0,RKF=0,QU=0,QL=[],lc=0,tmo=0;
try{TCS=+localStorage.getItem('cr_tc')||0}catch(e){}
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return(ms/60|0)+':'+String(ms%60).padStart(2,'0')};
function drawC(){$('#clk').hidden=!TC;['w','b'].forEach(c=>{const e=$('#ck'+c);e.querySelector('b').textContent=fmt(CK[c]);e.classList.toggle('on',!!S&&S.t===c&&!done);e.classList.toggle('lo',CK[c]<20000&&CK[c]>0)})}
function setC(ms){TC=ms;CK={w:ms,b:ms};lt=Date.now();tmo=0;drawC()}
function tcUI(){$('#tcs').innerHTML='<small style="width:100%;text-align:center">Waktu per pemain</small>'+[[0,'Tanpa waktu'],[180000,'3 menit'],[300000,'5 menit'],[600000,'10 menit']].map(([v,n])=>`<button data-v="${v}" class="${TCS===v?'on':''}">${n}</button>`).join('')}
$('#tcs').onclick=e=>{const b=e.target.closest('button');if(!b)return;TCS=+b.dataset.v;try{localStorage.setItem('cr_tc',TCS)}catch(x){}tcUI()};
tcUI();
function timeUp(){const l=S.t,w=l==='w'?'b':'w';
 if(mode==='online'){if(l===me&&RM)RM.child('meta').update({status:'ended',result:{winner:w,reason:'time',by:me,ts:ST}});return}
 gid++;busy=0;const k=(mode==='bot'&&l==='w')?2:1;
 fin(k,mode==='pvp'?`Waktu habis! ${w==='w'?'Putih':'Hitam'} menang`:k===1?'Waktu bot habis. Kamu menang!':'Waktumu habis',k===2?'sad':mode==='pvp'?'crown':'trophy',l,'Waktu habis')}
setInterval(()=>{const n=Date.now(),dt=n-lt;lt=n;if(!TC||!S||done||paused||!gm.classList.contains('on')||n<rdy)return;
 CK[S.t]-=dt;drawC();if(CK[S.t]<=0&&!tmo){tmo=1;timeUp()}},250);

/* ---- Chat & emoji ---- */
function showChat(v){const bb=$('#bub'),d=document.createElement('div'),mine=mode==='online'?v.c===me:v.c==='w';
 d.className='bb'+(mine?' me':'');d.innerHTML='<b>'+esc(v.n||'')+'</b> '+esc(v.x||v.e||'');bb.appendChild(d);
 while(bb.children.length>4)bb.firstChild.remove();setTimeout(()=>d.remove(),5000);sfx('k');
 if(v.e){const f=document.createElement('div');f.className='fe';f.textContent=v.e;f.style.top=mine?'62%':'22%';f.style.left=(25+Math.random()*50)+'%';gm.appendChild(f);setTimeout(()=>f.remove(),1800);
  const g=S&&PM[S.b.indexOf(v.c==='w'?'K':'k')];
  if(g&&!g.userData.mv){g.userData.mv=1;tw(1000,p=>{g.position.y=Math.abs(Math.sin(p*Math.PI*3))*.9*(1-p*.3);g.rotation.y=g.userData.by+p*Math.PI*2},()=>g.userData.mv=0)}}}
function sendC(e,x){const n=Date.now();if(n-lc<900)return;lc=n;
 if(mode==='online'&&RM)return void RM.child('chat').push({c:me,n:(PL[me]||{}).name||'Pemain',e:e||null,x:x||null,ts:ST}).catch(()=>{});
 showChat({c:mode==='pvp'?S.t:'w',n:'Kamu',e,x});
 if(mode==='bot'&&e)setTimeout(()=>showChat({c:'b',n:'Bot',e:['😏','😂','🤔','😎','🔥','🙄'][Math.random()*6|0]}),900)}
$('#qe').onclick=e=>{const b=e.target.closest('[data-e]');if(b)sendC(b.dataset.e)};
$('#cs').onclick=()=>{const t=$('#ci').value.trim().slice(0,60);if(t){sendC(null,t);$('#ci').value=''}};
$('#ci').onkeydown=e=>{if(e.key==='Enter')$('#cs').click()};

/* ---- Hook ke mesin lama ---- */
const sA=start;start=function(m,l){sA(m,l);RK=0;setC(m==='online'?0:TCS)};
const nR=newRoom;newRoom=async function(nm){const c=await nR(nm);if(c)await to(DB.ref('rooms/'+c+'/meta').update({tc:TCS,rk:RKF?1:0}));return c};
const sO=startOnline;startOnline=async function(c,col,ended){await sO(c,col,ended);RK=0;$('#sh').hidden=false;
 RM.child('meta').once('value').then(s=>{const m=s.val()||{};RK=!!m.rk;if(m.tc)setC(m.tc)});
 const t0=Date.now()+OFF-3000,on=(r,ev,fn)=>{LS.push(r);r.on(ev,fn)};
 on(RM.child('chat'),'child_added',s=>{const v=s.val();if(v&&(v.ts||0)>=t0)showChat(v)});
 on(RM.child('meta/result'),'value',s=>{const r=s.val();if(!r||done||r.reason!=='time')return;recordEnd(r.winner,'time',0);const win=r.winner===me;
  fin(win?1:2,win?'Waktu lawan habis. Kamu menang!':'Waktumu habis',win?'trophy':'sad',r.winner==='w'?'b':'w','Waktu habis')})};
const rE=recordEnd;recordEnd=function(w,why,wr){const f=!rec;rE(w,why,wr);
 if(f&&rec&&RK&&DB)DB.ref('players/'+UID).transaction(p=>{p=p||{};p.pts=Math.max(0,(p.pts||0)+(w==='draw'?5:w===me?25:-20));p.rk=(p.rk||0)+1;return p}).catch(()=>{})};

/* ---- Ranked acak ---- */
function qStop(){QL.forEach(r=>{try{r.off()}catch(e){}});QL=[];
 if(QU){QU=0;if(FBOK){const r=DB.ref('queue/'+UID);try{r.onDisconnect().cancel()}catch(e){}r.remove().catch(()=>{})}}$('#sh').hidden=false}
async function rkStart(){if(!FBOK)return olInit();if(QU)return;QU=1;RKF=1;
 const nm=nmv(),qr=DB.ref('queue'),mr=DB.ref('matches/'+UID),my=DB.ref('queue/'+UID);
 $('#rc').textContent='...';$('#wtx').textContent='Mencari lawan acak ('+(TCS?TCS/60000+' menit':'tanpa waktu')+')\u2026';$('#sh').hidden=true;$('#wt').classList.add('on');
 try{my.onDisconnect().remove();await to(my.set({name:nm,tc:TCS,t:ST}))}catch(e){qStop();RKF=0;$('#wt').classList.remove('on');return msg(errM(e))}
 mr.on('value',s=>{const v=s.val();if(!v||!QU)return;mr.remove();qStop();RKF=0;$('#wt').classList.remove('on');joinRoom(v.room)});
 let bz=0;
 qr.on('value',async s=>{if(!QU||bz)return;const q=s.val()||{},o=Object.keys(q).filter(k=>k>UID&&q[k]&&q[k].tc===TCS).sort()[0];if(!o)return;bz=1;
  try{const tr=await to(DB.ref('queue/'+o).transaction(c=>c?null:undefined));if(!tr.committed||!QU){bz=0;return}
   const c=await newRoom(nm);if(!c){bz=0;return}
   await to(DB.ref('matches/'+o).set({room:c}));qStop();RKF=0;waitFor(c);$('#wtx').textContent='Lawan ditemukan, menyambungkan\u2026';$('#sh').hidden=true}
  catch(e){bz=0}});
 QL=[qr,mr]}
$('#rk').onclick=rkStart;
$('#wc').onclick=()=>{qStop();RKF=0;cancelWait()};

/* ---- Papan peringkat ---- */
function openLB(){$('#lbm').classList.add('on');const l=$('#lbl');
 if(!FBOK){l.textContent='Butuh koneksi Firebase.';return}
 l.textContent='Memuat\u2026';
 to(DB.ref('players').orderByChild('pts').limitToLast(20).once('value')).then(s=>{const a=[];s.forEach(c=>{a.push({k:c.key,...c.val()})});a.reverse();
  l.innerHTML=a.length?a.map((p,i)=>`<div class="pl"><b>${i<3?['\u{1F947}','\u{1F948}','\u{1F949}'][i]:i+1}</b><span>${esc(p.name||'Pemain')}${p.k===UID?' (kamu)':''}</span><small>${p.pts|0} poin \u00B7 ${p.wins|0}M</small></div>`).join(''):'<small>Belum ada data. Main Ranked dulu!</small>'}).catch(e=>l.textContent=errM(e))}
$('#lbk').onclick=openLB;$('#lbx').onclick=()=>$('#lbm').classList.remove('on');
})();

</script>
</body>
</html>
