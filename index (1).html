<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Royale</title>
<style>
:root{--bg:#e9eef3;--fg:#14202b;--cd:#f8fafc;--ac:#0f8f80;--bd:#c3d0dc;--lt:#dbe4ec;--dk:#6d8ba6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--fg:#e6eef5;--cd:#17212b;--ac:#35c4b0;--bd:#2a3a49;--lt:#b9c7d4;--dk:#4a6580}}
:root[data-theme="dark"]{--bg:#0d141b;--fg:#e6eef5;--cd:#17212b;--ac:#35c4b0;--bd:#2a3a49;--lt:#b9c7d4;--dk:#4a6580}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden;opacity:0;visibility:hidden;transform:scale(1.06);transition:opacity .5s,transform .5s,visibility 0s .5s;background:radial-gradient(circle at 50% 30%,var(--cd),var(--bg) 72%)}
.scr.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
/* intro */
.bgp span{position:absolute;bottom:-70px;opacity:.12;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.kn{font-size:96px;line-height:1;color:var(--ac);text-shadow:0 0 24px var(--ac);animation:gal 1.3s cubic-bezier(.2,1.2,.4,1) backwards,glow 2.5s 1.3s ease-in-out infinite}
@keyframes gal{from{transform:translateX(-130vw) rotate(-25deg)}}
@keyframes glow{50%{transform:scale(1.08);text-shadow:0 0 44px var(--ac)}}
h1{margin:0;font:700 clamp(32px,10vw,50px)/1 "Palatino Linotype",Palatino,"Book Antiqua",serif;letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:center}
h1 i{font-style:normal;display:inline-block;animation:ltr .6s backwards}
@keyframes ltr{from{opacity:0;transform:translateY(30px) rotate(12deg)}}
.sp{width:min(80vw,320px);height:40px;border-radius:8px;background:repeating-conic-gradient(var(--dk) 0 25%,var(--lt) 0 50%) 0 0/40px 40px;animation:sw 1s .4s backwards,scr 4s linear infinite}
@keyframes sw{from{transform:scaleX(0)}}
@keyframes scr{to{background-position:80px 0}}
.ld{width:min(60vw,240px);height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.ld i{display:block;height:100%;background:var(--ac);animation:ld 2.4s .3s ease-in-out both}
@keyframes ld{from{width:0}to{width:100%}}
.go{padding:12px 36px;border-radius:30px;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .15s}
.go:active{transform:scale(.95)}
#enter{animation:pop .5s 2.7s backwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
/* menu */
.mt{margin:0;font:700 28px "Palatino Linotype",Palatino,serif}
.card{width:min(88vw,360px);padding:16px 18px;border-radius:16px;border:2px solid var(--bd);background:var(--cd);text-align:left;display:block;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:19px}
.card small{opacity:.7}
.on .card{animation:pop .45s backwards}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(88vw,360px)}
.g2 .card{width:auto;text-align:center}
.lnk{background:none;border:0;opacity:.7;padding:8px}
/* game */
#game{--s:min(100vw,56vh,560px);--s:min(100vw,60dvh,560px);gap:8px;padding:8px 0}
#hd{display:flex;align-items:center;gap:8px;width:min(94vw,520px)}
#hd button{padding:6px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--cd)}
#st{flex:1;text-align:center;font-weight:700}
#md{opacity:.7;font-size:14px;text-align:center}
#cv{width:var(--s);height:var(--s);touch-action:none;cursor:grab}
#cv canvas{display:block}
#ov{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .4s}
#ov.on{opacity:1;visibility:visible}
#ov>div{background:var(--cd);border:2px solid var(--ac);border-radius:20px;padding:24px;text-align:center;width:min(86vw,320px)}
#ov.on>div{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
#ov h2{margin:8px 0 16px}
#oe{display:block;font-size:64px;animation:bn 1s infinite alternate}
@keyframes bn{to{transform:translateY(-12px) rotate(8deg)}}
#snd,#cfg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);font-size:20px}
#cfg{right:64px}
#set{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s}
#set.on{opacity:1;visibility:visible}
#set>div{background:var(--cd);border:2px solid var(--ac);border-radius:20px;padding:20px;width:min(88vw,340px);display:flex;flex-direction:column;gap:10px}
#set.on>div{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
#set h2{margin:0 0 4px;font:700 22px "Palatino Linotype",Palatino,serif}
.tr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:none;text-align:left;width:100%}
.tr.on{border-color:var(--ac);background:rgba(53,196,176,.14)}
.vl{display:flex;align-items:center;gap:10px}
.vl input{flex:1;accent-color:var(--ac)}
@media(prefers-reduced-motion:reduce){.bgp,.p{animation:none!important}}
</style>
</head>
<body>
<div id="intro" class="scr on">
  <div class="bgp"></div>
  <div class="kn">&#9822;&#xFE0E;</div>
  <h1></h1>
  <div class="sp"></div>
  <div class="ld"><i></i></div>
  <button class="go" id="enter" disabled>Masuk</button>
</div>

<div id="menu" class="scr">
  <h2 class="mt">Pilih mode main</h2>
  <div id="mm" class="col">
    <button class="card" data-m="pvp"><b>&#128101; Main Berdua</b><small>Dua pemain bergantian di satu layar</small></button>
    <button class="card" data-m="bot"><b>&#129302; Lawan Bot</b><small>Kamu main Putih, bot main Hitam</small></button>
  </div>
  <div id="lv" class="col" hidden>
    <small>Pilih level bot</small>
    <div class="g2">
      <button class="card" data-l="1"><b>&#127793; Easy</b><small>Santai</small></button>
      <button class="card" data-l="2"><b>&#9876;&#65039; Medium</b><small>Mulai pintar</small></button>
      <button class="card" data-l="3"><b>&#128293; Hard</b><small>Menantang</small></button>
      <button class="card" data-l="4"><b>&#128081; Professional</b><small>Berpikir dalam</small></button>
    </div>
    <button class="lnk" id="lb">Kembali</button>
  </div>
</div>

<div id="game" class="scr">
  <div id="hd"><button id="back">Menu</button><div id="st"></div><button id="rs" aria-label="Ulangi">&#8635;</button></div>
  <div id="cv"></div>
  <div id="md"></div>
  <div id="ov"><div><span id="oe"></span><h2 id="ot"></h2><button class="go" id="again">Main lagi</button><br><button class="lnk" id="tomenu">Ke menu</button></div></div>
</div>
<button id="snd" aria-label="Suara">&#128266;</button>
<button id="cfg" aria-label="Pengaturan musik">&#9881;&#65039;</button>
<div id="set"><div><h2>Pengaturan musik</h2><div id="tl" style="display:flex;flex-direction:column;gap:8px"></div><label class="vl">Volume <input type="range" id="vol" min="0" max="1" step=".05"></label><button class="go" id="sx">Selesai</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),V={P:100,N:320,B:330,R:500,Q:900,K:0},
G={k:'\u265A\uFE0E',q:'\u265B\uFE0E',r:'\u265C\uFE0E',b:'\u265D\uFE0E',n:'\u265E\uFE0E',p:'\u265F\uFE0E'},
D={N:[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],B:[[1,1],[1,-1],[-1,1],[-1,-1]],R:[[1,0],[-1,0],[0,1],[0,-1]]};
D.Q=D.B.concat(D.R);D.K=D.Q;
const isW=p=>p===p.toUpperCase(),CR={63:'K',56:'Q',7:'k',0:'q'},
NM=['','Easy','Medium','Hard','Professional'],
LV=[0,{d:1,n:220,ms:300},{d:2,n:60,ms:800},{d:3,n:0,ms:2000},{d:7,n:0,ms:3000}],
init=()=>[...'rnbqkbnr'.split(''),...Array(8).fill('p'),...Array(32).fill(''),...Array(8).fill('P'),...'RNBQKBNR'.split('')];

/* ===== mesin catur ===== */
function att(b,s,by){const r=s>>3,c=s&7,w=by==='w',
 at=(rr,cc,set)=>{if(rr<0||rr>7||cc<0||cc>7)return 0;const p=b[rr*8+cc];return p&&isW(p)===w&&set.includes(p.toUpperCase())},
 pr=w?r+1:r-1;
 if(at(pr,c-1,'P')||at(pr,c+1,'P'))return 1;
 for(const[dr,dc]of D.N)if(at(r+dr,c+dc,'N'))return 1;
 for(const[dr,dc]of D.K)if(at(r+dr,c+dc,'K'))return 1;
 for(const[ds,set]of[[D.B,'BQ'],[D.R,'RQ']])for(const[dr,dc]of ds){let rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=b[rr*8+cc];if(p){if(isW(p)===w&&set.includes(p.toUpperCase()))return 1;break}rr+=dr;cc+=dc}}
 return 0}
const inChk=(b,t)=>att(b,b.indexOf(t==='w'?'K':'k'),t==='w'?'b':'w');
function gen(S){const m=[],b=S.b,w=S.t==='w';
 for(let i=0;i<64;i++){const p=b[i];if(!p||isW(p)!==w)continue;
  const r=i>>3,c=i&7,u=p.toUpperCase(),add=(t,x)=>m.push({f:i,t,...x});
  if(u==='P'){const d=w?-1:1,t1=i+d*8,pr=(r+d===0||r+d===7)?{pr:1}:{};
   if(!b[t1]){add(t1,pr);if(r===(w?6:1)&&!b[t1+d*8])add(t1+d*8,{dp:1})}
   for(const dc of[-1,1]){const cc=c+dc,t=t1+dc;if(cc<0||cc>7)continue;
    if(b[t]&&isW(b[t])!==w)add(t,pr);else if(t===S.ep)add(t,{e:1})}
   continue}
  for(const[dr,dc]of D[u]){let rr=r+dr,cc=c+dc;
   while(rr>=0&&rr<8&&cc>=0&&cc<8){const t=rr*8+cc,q=b[t];
    if(q){if(isW(q)!==w)add(t);break}
    add(t);if(u==='N'||u==='K')break;rr+=dr;cc+=dc}}
  if(u==='K'){const h=w?60:4,e=w?'b':'w',R=w?'R':'r';
   if(i===h&&!att(b,h,e)){
    if(S.c[w?'K':'k']&&!b[h+1]&&!b[h+2]&&b[h+3]===R&&!att(b,h+1,e))add(h+2,{cs:1});
    if(S.c[w?'Q':'q']&&!b[h-1]&&!b[h-2]&&!b[h-3]&&b[h-4]===R&&!att(b,h-1,e))add(h-2,{cs:1})}}}
 return m}
function mk(S,m){const b=S.b.slice(),p=b[m.f],w=isW(p),c={...S.c};
 b[m.t]=p;b[m.f]='';
 if(m.e)b[m.t+(w?8:-8)]='';
 if(m.pr)b[m.t]=w?'Q':'q';
 if(m.cs){const k=m.t>m.f;b[k?m.f+1:m.f-1]=b[k?m.f+3:m.f-4];b[k?m.f+3:m.f-4]=''}
 if(p==='K')c.K=c.Q=0;if(p==='k')c.k=c.q=0;
 if(CR[m.f])c[CR[m.f]]=0;if(CR[m.t])c[CR[m.t]]=0;
 return{b,t:S.t==='w'?'b':'w',c,ep:m.dp?(m.f+m.t)/2:-1}}
const legal=S=>gen(S).filter(m=>!inChk(mk(S,m).b,S.t));
function ev(b){let s=0;for(let i=0;i<64;i++){const p=b[i];if(!p)continue;
 const u=p.toUpperCase(),w=p===u,r=i>>3,c=i&7,cd=7-Math.abs(c-3.5)-Math.abs(r-3.5);
 const v=V[u]+(u==='P'?(w?6-r:r-1)*10+cd*2:u==='N'||u==='B'?cd*7:u==='K'?-cd*8:u==='Q'?cd:0);
 s+=w?v:-v}return s}
const ord=(S,ms)=>ms.map(m=>[m,(S.b[m.t]?V[S.b[m.t].toUpperCase()]*10-V[S.b[m.f].toUpperCase()]:0)+(m.pr?800:0)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
function q(S,a,B,d){const s=ev(S.b)*(S.t==='w'?1:-1);if(s>=B)return B;if(s>a)a=s;if(d<=0)return a;
 for(const m of ord(S,gen(S).filter(m=>S.b[m.t]||m.e))){const n=mk(S,m);if(inChk(n.b,S.t))continue;
  const v=-q(n,-B,-a,d-1);if(v>=B)return B;if(v>a)a=v}return a}
function srch(S,d,a,B,dl){if(Date.now()>dl)throw 0;if(d<=0)return q(S,a,B,4);
 const ms=ord(S,legal(S));if(!ms.length)return inChk(S.b,S.t)?-9e4-d:0;
 for(const m of ms){const v=-srch(mk(S,m),d-1,-B,-a,dl);if(v>=B)return B;if(v>a)a=v}return a}
function pick(S,L){let ms=ord(S,legal(S).sort(()=>Math.random()-.5)),bm=ms[0];const dl=Date.now()+L.ms;
 for(let d=1;d<=L.d;d++){try{let a=-1e6,bs=-1e7,cm;
  for(const m of ms){const v=-srch(mk(S,m),d-1,-1e6,-a,dl)+Math.random()*L.n;if(v>bs){bs=v;cm=m}if(!L.n&&v>a)a=v}
  bm=cm;ms=[cm,...ms.filter(x=>x!==cm)];if(bs>8e4)break}catch(e){break}}
 return bm}

/* ===== suara & musik (musik dari file milikmu) ===== */
let AC,MG,MU,MS,AE,mu=true;
const hz=n=>440*2**((n-69)/12);
function tone(t,f,d,ty,v,a,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(MG);o.start(t);o.stop(t+d+.05)}
const TN=['Lagu 1 (4:30)','Lagu 2 (3:43)','Lagu 3 (3:58)','Lagu 4 (2:25)'];
let cur=0,vol=.6,tk=0;
try{const a=localStorage.getItem('cr_t'),v=localStorage.getItem('cr_v');if(a!==null)cur=+a;if(v!==null)vol=+v}catch(e){}
async function playT(){const k=++tk;try{if(MS){try{MS.stop()}catch(e){}MS=null}if(AE){AE.pause();AE=null}
 if(!AC||cur<0)return;const u='lagu'+(cur+1)+'.mp3';
 try{const ab=await AC.decodeAudioData(await(await fetch(u)).arrayBuffer());if(k!==tk)return;
  MS=AC.createBufferSource();MS.buffer=ab;MS.loop=true;MS.connect(MU);MS.start()}
 catch(e){if(k!==tk)return;AE=new Audio(u);AE.loop=true;AE.volume=vol;AE.muted=!mu;AE.play().catch(()=>{})}}catch(e){}}
function aud(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mu?.8:0;MG.connect(AC.destination);
 MU=AC.createGain();MU.gain.value=vol;MU.connect(MG);AC.resume();playT()}catch(e){AC=null}}
function trList(){$('#tl').innerHTML=['Tanpa musik',...TN].map((n,i)=>`<button class="tr${cur===i-1?' on':''}" data-i="${i-1}"><span>${cur===i-1?'\u25CF':'\u25CB'}</span>${i?'\uD83C\uDFB5 ':'\uD83D\uDD07 '}${n}</button>`).join('')}
$('#tl').onclick=e=>{const b=e.target.closest('.tr');if(!b)return;cur=+b.dataset.i;try{localStorage.setItem('cr_t',cur)}catch(x){}trList();playT()};
$('#vol').oninput=e=>{vol=+e.target.value;if(MU)MU.gain.value=vol;if(AE)AE.volume=vol;try{localStorage.setItem('cr_v',vol)}catch(x){}};
$('#cfg').onclick=()=>{trList();$('#vol').value=vol;$('#set').classList.add('on')};
$('#sx').onclick=()=>$('#set').classList.remove('on');
$('#set').onclick=e=>{if(e.target.id==='set')$('#set').classList.remove('on')};
function sfx(k){if(!AC||!mu)return;const t=AC.currentTime;
 if(k==='m'){tone(t,220,.14,'sine',.35,.005,110);tone(t,900,.04,'square',.04,.002)}
 else if(k==='x'){tone(t,160,.25,'sawtooth',.2,.005,60);tone(t,300,.12,'square',.08,.002,100)}
 else if(k==='c'){tone(t,660,.3,'square',.1,.01);tone(t+.15,880,.4,'square',.1,.01)}
 else if(k==='w')[60,64,67,72,76].forEach((n,i)=>tone(t+i*.12,hz(n),.8,'triangle',.18,.01));
 else tone(t,500,.06,'sine',.12,.003,300)}
$('#snd').onclick=()=>{mu=!mu;$('#snd').textContent=mu?'\uD83D\uDD0A':'\uD83D\uDD07';if(MG)MG.gain.setTargetAtTime(mu?.8:0,AC.currentTime,.05);if(AE)AE.muted=!mu};
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
document.addEventListener('click',e=>{if(e.target.closest('button')&&e.target.id!=='snd')sfx('k')});

/* ===== papan & bidak 3D (three.js) ===== */
const gm=$('#game'),lat=pts=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),32),
 sph=(r,y,sy=1)=>({g:new THREE.SphereGeometry(r,24,16),p:[0,y,0],s:[1,sy,1]}),
 box=(w,h,d,x,y,z)=>({g:new THREE.BoxGeometry(w,h,d),p:[x,y,z]}),
 ring=(r,y)=>({g:new THREE.TorusGeometry(r,.028,10,40),p:[0,y,0],a:1}),
 body=pts=>({g:lat(pts),p:[0,0,0]}),
 P3=i=>[(i&7)-3.5,(i>>3)-3.5],ez=p=>p<.5?2*p*p:1-2*(1-p)*(1-p);
function bounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
let R3,SC,CAM,ray,PARTS,MW,MB,MA,SQ=[],HD=[],HR=[],PM=Array(64).fill(null),TW=[],az=0,el=.95,dist=16,ckI=-1,rdy=0;
const C={l:new THREE.Color(0xdde5ec),d:new THREE.Color(0x4f6f8c),y:new THREE.Color(0xf2c94c),r:new THREE.Color(0xe04545)};
function init3d(){
 R3=new THREE.WebGLRenderer({antialias:true,alpha:true});R3.setPixelRatio(Math.min(devicePixelRatio||1,2));
 R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.PCFSoftShadowMap;cv.appendChild(R3.domElement);
 SC=new THREE.Scene();CAM=new THREE.PerspectiveCamera(40,1,.1,100);ray=new THREE.Raycaster();
 SC.add(new THREE.HemisphereLight(0xffffff,0x40566b,.8));
 const dl=new THREE.DirectionalLight(0xffffff,.95);dl.position.set(4,10,6);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
 Object.assign(dl.shadow.camera,{left:-7,right:7,top:7,bottom:-7});dl.shadow.camera.updateProjectionMatrix();dl.shadow.bias=-.0006;SC.add(dl);
 const rl=new THREE.PointLight(0x7fd8ff,.5);rl.position.set(-6,4,-6);SC.add(rl);
 MW=new THREE.MeshStandardMaterial({color:0xf3efe6,roughness:.3,metalness:.12});
 MB=new THREE.MeshStandardMaterial({color:0x232b36,roughness:.25,metalness:.35});
 MA=new THREE.MeshStandardMaterial({color:0xe0b050,roughness:.3,metalness:.4,emissive:0x4a3510});
 const fr=new THREE.Mesh(new THREE.BoxGeometry(9.2,.5,9.2),new THREE.MeshStandardMaterial({color:0x1a2430,roughness:.45,metalness:.3}));
 fr.position.y=-.3;fr.castShadow=fr.receiveShadow=true;SC.add(fr);
 const gr=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.28}));gr.rotation.x=-Math.PI/2;gr.position.y=-.56;gr.receiveShadow=true;SC.add(gr);
 const sg=new THREE.BoxGeometry(1,.25,1),dg=new THREE.CircleGeometry(.17,24),rg=new THREE.RingGeometry(.36,.46,32),
  hm=new THREE.MeshBasicMaterial({color:0x0b6b5e,transparent:true,opacity:.6}),hm2=new THREE.MeshBasicMaterial({color:0xd23030,transparent:true,opacity:.85});
 for(let i=0;i<64;i++){const[x,z]=P3(i),s=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({roughness:.5,metalness:.05}));
  s.position.set(x,-.125,z);s.receiveShadow=true;s.userData.i=i;SC.add(s);SQ.push(s);
  const d=new THREE.Mesh(dg,hm),r=new THREE.Mesh(rg,hm2);
  [d,r].forEach(h=>{h.rotation.x=-Math.PI/2;h.position.set(x,.012,z);h.visible=false;SC.add(h)});HD.push(d);HR.push(r)}
 const sh=new THREE.Shape();[[-.2,.18],[.22,.18],[.16,.44],[.35,.56],[.37,.7],[.2,.84],[.13,1.04],[.02,.9],[-.14,.82],[-.27,.5]].forEach((q,i)=>i?sh.lineTo(q[0],q[1]):sh.moveTo(q[0],q[1]));
 const hg=new THREE.ExtrudeGeometry(sh,{depth:.2,bevelEnabled:true,bevelThickness:.06,bevelSize:.06,bevelSegments:3});hg.translate(0,0,-.1);
 const cr=(x,z)=>box(.14,.13,.14,x,1.04,z);
 PARTS={
  p:[body([[0,0],[.33,0],[.33,.06],[.26,.12],[.16,.24],[.11,.42],[.2,.5],[.2,.54],[.11,.58],[0,.58]]),sph(.17,.72),ring(.205,.52),ring(.325,.03)],
  r:[body([[0,0],[.34,0],[.34,.07],[.27,.14],[.2,.26],[.19,.62],[.3,.7],[.3,.98],[.22,.98],[.22,.9],[0,.9]]),cr(.22,0),cr(-.22,0),cr(0,.22),cr(0,-.22),ring(.3,.8),ring(.335,.03)],
  b:[body([[0,0],[.34,0],[.34,.07],[.26,.14],[.14,.32],[.1,.56],[.19,.63],[.19,.68],[.1,.74],[0,.74]]),sph(.17,.93,1.5),sph(.05,1.22),ring(.195,.655),ring(.335,.03)],
  q:[body([[0,0],[.37,0],[.37,.07],[.29,.15],[.15,.36],[.12,.8],[.25,.88],[.25,.94],[.14,1],[.14,1.02],[.3,1.3],[0,1.3]]),sph(.09,1.38),ring(.255,.91),ring(.365,.03)],
  k:[body([[0,0],[.37,0],[.37,.07],[.29,.15],[.15,.36],[.12,.82],[.26,.9],[.26,.96],[.14,1.02],[.14,1.04],[.28,1.26],[0,1.26]]),box(.09,.34,.09,0,1.43,0),box(.26,.08,.09,0,1.47,0),ring(.265,.93),ring(.365,.03)],
  n:[body([[0,0],[.36,0],[.36,.06],[.3,.11],[.26,.2],[0,.2]]),{g:hg,p:[0,0,0]},ring(.355,.03)]}}
function mkP(t,w){const g=new THREE.Group();
 PARTS[t].forEach(o=>{const e=new THREE.Mesh(o.g,o.a?MA:w?MW:MB);e.position.set(...o.p);if(o.s)e.scale.set(...o.s);if(o.a)e.rotation.x=Math.PI/2;e.castShadow=true;g.add(e)});
 g.userData={w,t,i:-1,lift:0,ph:Math.random()*6,by:t==='n'?(w?1:-1)*Math.PI/2:0,mv:0};return g}
function fit(){const w=cv.clientWidth,h=cv.clientHeight;if(!R3||!w||!h)return;R3.setSize(w,h);CAM.aspect=w/h;
 dist=5.7/(Math.tan(CAM.fov*Math.PI/360)*Math.min(1,CAM.aspect))+1;CAM.updateProjectionMatrix()}
function tw(dur,fn,done,delay=0){TW.push({t0:performance.now()+delay,dur,fn,done})}
function put(i,ch,dl){const g=mkP(ch.toLowerCase(),isW(ch)),[x,z]=P3(i);g.position.set(x,0,z);g.rotation.y=g.userData.by;g.userData.i=i;SC.add(g);PM[i]=g;
 if(dl!==undefined){g.visible=false;g.userData.mv=1;tw(750,p=>{g.visible=true;g.position.y=8*(1-bounce(p))},()=>g.userData.mv=0,dl)}
 return g}
function build(){SC.children.filter(o=>o.userData.fx).forEach(o=>SC.remove(o));PM.forEach(g=>g&&SC.remove(g));TW=[];PM.fill(null);
 S.b.forEach((c,i)=>{if(c)put(i,c,(i&7)*35+Math.min(i>>3,7-(i>>3))*70)});rdy=Date.now()+1600}
function paint(){const kI=inChk(S.b,S.t)?S.b.indexOf(S.t==='w'?'K':'k'):-1;ckI=kI;
 SQ.forEach((s,i)=>{const c=s.material.color.copy(((i>>3)+(i&7))%2?C.d:C.l);s.material.emissive.setRGB(0,0,0);
  if(last&&(i===last.f||i===last.t))c.lerp(C.y,.4);if(i===sel)c.lerp(C.y,.85);if(i===kI)c.lerp(C.r,.8);
  const mv=sel!==null&&LM.some(x=>x.f===sel&&x.t===i);HD[i].visible=mv&&!S.b[i];HR[i].visible=mv&&!!S.b[i]})}
function hop(g,f,t,cb){const[a,b]=P3(f),[c,d]=P3(t),h=g.userData.t==='n'?1:.5;g.userData.mv=1;
 tw(450,p=>{const e=ez(p);g.position.set(a+(c-a)*e,Math.sin(p*Math.PI)*h,b+(d-b)*e)},()=>{g.userData.mv=0;cb&&cb()})}
function kill(g,sq){const[x,z]=P3(sq);g.userData.mv=1;g.userData.fx=1;
 tw(450,p=>{g.scale.setScalar(Math.max(.001,1-p));g.rotation.y+=.25;g.position.y=p*1.2},()=>SC.remove(g),230);
 const m=new THREE.Mesh(new THREE.RingGeometry(.25,.34,32),new THREE.MeshBasicMaterial({color:0x35c4b0,transparent:true}));
 m.userData.fx=1;m.rotation.x=-Math.PI/2;m.position.set(x,.03,z);SC.add(m);
 tw(500,p=>{m.scale.setScalar(1+p*3);m.material.opacity=1-p},()=>SC.remove(m),230)}
function loop(now){requestAnimationFrame(loop);if(!R3||!gm.classList.contains('on'))return;
 const t=now/1000,n=performance.now(),cur=TW;TW=[];
 cur.forEach(o=>{if(n<o.t0){TW.push(o);return}const p=Math.min(1,(n-o.t0)/o.dur);o.fn(p);if(p>=1){o.done&&o.done()}else TW.push(o)});
 PM.forEach((g,i)=>{if(!g||g.userData.mv)return;const u=g.userData;u.lift+=((i===sel?.4:0)-u.lift)*.2;
  g.position.y=u.lift+Math.sin(t*1.6+u.ph)*.025;g.rotation.y=u.by+(i===sel?Math.sin(t*4)*.3:0)});
 if(ckI>=0)SQ[ckI].material.emissive.setRGB(.35+.25*Math.sin(t*6),0,0);
 CAM.position.set(dist*Math.cos(el)*Math.sin(az),dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));CAM.lookAt(0,0,.2);
 R3.render(SC,CAM)}

/* ===== alur permainan ===== */
let S,LM,sel=null,last=null,mode,lvl,busy=0,done=0,gid=0,dn=null;
const show=id=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
function status(ck){$('#st').textContent=(S.t==='w'?'Giliran Putih':mode==='bot'?'Giliran Bot':'Giliran Hitam')+(ck?' - Skak!':'')}
function start(m,l){mode=m;lvl=l;gid++;S={b:init(),t:'w',c:{K:1,Q:1,k:1,q:1},ep:-1};LM=legal(S);sel=null;last=null;done=0;busy=0;az=0;el=.95;
 $('#ov').classList.remove('on');status();
 $('#md').textContent=m==='bot'?`Kamu (Putih) lawan Bot ${NM[l]}. Geser layar untuk memutar papan.`:'Putih lawan Hitam, satu perangkat. Geser layar untuk memutar papan.';
 show('game');if(R3){fit();build();paint()}}
function think(){busy=1;const g=gid;$('#st').textContent='Bot berpikir\u2026';
 setTimeout(()=>{if(g!==gid||!busy)return;const m=pick(S,LV[lvl]);busy=0;play(m)},650)}
function end(ck){done=1;const t=S.t,win=t==='w'?'Hitam':'Putih',g=gid;
 if(ck){const k=PM[S.b.indexOf(t==='w'?'K':'k')];if(k){k.userData.mv=1;tw(900,p=>{k.rotation.z=1.5*ez(p);k.position.y=.3*ez(p)},null,400)}}
 setTimeout(()=>sfx('w'),350);$('#st').textContent=ck?'Skakmat!':'Remis';
 setTimeout(()=>{if(g!==gid)return;
  $('#oe').textContent=!ck?'\uD83E\uDD1D':mode==='bot'?(t==='b'?'\uD83C\uDFC6':'\uD83E\uDD16'):'\uD83D\uDC51';
  $('#ot').textContent=!ck?'Remis, tidak ada langkah sah':mode==='bot'?(t==='b'?'Skakmat! Kamu menang':'Skakmat! Bot menang'):`Skakmat! ${win} menang`;
  $('#ov').classList.add('on')},1500)}
function play(m){const w=S.t==='w',ci=m.e?m.t+(w?8:-8):m.t,cp=S.b[ci],p=PM[m.f],cg=cp?PM[ci]:null;
 S=mk(S,m);last=m;sel=null;LM=legal(S);const pc=S.b[m.t];
 PM[m.f]=null;if(cg){PM[ci]=null;kill(cg,m.t)}
 PM[m.t]=p;p.userData.i=m.t;
 hop(p,m.f,m.t,()=>{if(m.pr&&PM[m.t]===p){SC.remove(p);const q=put(m.t,pc);q.userData.mv=1;q.scale.setScalar(.01);
  tw(450,x=>q.scale.setScalar(.01+.99*bounce(x)),()=>q.userData.mv=0)}});
 if(m.cs){const r=m.t>m.f,rf=r?m.f+3:m.f-4,rt=r?m.f+1:m.f-1,rg=PM[rf];PM[rf]=null;PM[rt]=rg;rg.userData.i=rt;hop(rg,rf,rt)}
 paint();const ck=inChk(S.b,S.t);
 if(!LM.length)end(ck);else{setTimeout(()=>sfx(ck?'c':cp?'x':'m'),300);status(ck);if(mode==='bot'&&S.t==='b')think()}}
function tap(e){if(done||busy||Date.now()<rdy||(mode==='bot'&&S.t==='b'))return;
 const r=cv.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height)*2+1},CAM);
 const h=ray.intersectObjects([...SQ,...PM.filter(Boolean)],true)[0];if(!h)return;
 let o=h.object;while(o&&o.userData.i===undefined)o=o.parent;if(!o)return;
 const i=o.userData.i,m=sel!==null&&LM.find(x=>x.f===sel&&x.t===i);
 if(m)return play(m);
 const p=S.b[i];if(p&&isW(p)===(S.t==='w')&&sel!==i){sel=i;sfx('k')}else sel=null;paint()}
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,mv:0};try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;
 if(Math.abs(dx)+Math.abs(dy)>8)dn.mv=1;
 if(dn.mv){az-=dx*.008;el=Math.min(1.35,Math.max(.55,el+dy*.006));dn.x=e.clientX;dn.y=e.clientY}});
cv.addEventListener('pointerup',e=>{if(dn&&!dn.mv)tap(e);dn=null});
cv.addEventListener('pointercancel',()=>dn=null);
const toMenu=()=>{gid++;busy=0;$('#mm').hidden=false;$('#lv').hidden=true;show('menu')};
$('#back').onclick=$('#tomenu').onclick=toMenu;
$('#rs').onclick=$('#again').onclick=()=>start(mode,lvl);
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>b.dataset.m==='pvp'?start('pvp'):($('#mm').hidden=true,$('#lv').hidden=false));
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start('bot',+b.dataset.l));
$('#lb').onclick=()=>{$('#mm').hidden=false;$('#lv').hidden=true};
$('#enter').onclick=()=>{aud();show('menu')};
try{init3d();addEventListener('resize',fit);fit();requestAnimationFrame(loop)}catch(e){R3=null;cv.textContent='Perangkat ini belum mendukung grafik 3D (WebGL).'}
